robomaster_server:
  ros__parameters:
    local_ip: "192.168.0.101"      # local ip of the network on which drones are connected
    num_of_drones: 0               # number of drones to be used
    num_of_eps1: 1                 # numebr of EP or S1 Robots to be used
    random_assign: True            # whether to assign drones and robot numbers randomly (Ascending order of IPs last octet)
    keyboard_cmd: True
